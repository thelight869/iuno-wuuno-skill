name: Inspect A-share database

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DB_URL: https://github.com/noblechang/a-share-data/releases/download/FREE_DATA_v0/ashare_pit.duckdb
  DB_SHA256: 95601e2f1f5b62595a80e735a52da3a64c7446ebe7f8c984e3394b96f90e4778

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip duckdb
      - name: Download verified public database
        run: |
          set -euxo pipefail
          curl -L --fail --retry 8 --retry-delay 10 --continue-at - "$DB_URL" -o ashare_pit.duckdb
          echo "$DB_SHA256  ashare_pit.duckdb" | sha256sum -c -
          ls -lh ashare_pit.duckdb
      - name: Inspect schema and samples
        run: python research/inspect_db.py
      - name: Upload inspection results
        uses: actions/upload-artifact@v4
        with:
          name: ashare-db-inspection
          path: output/
          retention-days: 7
